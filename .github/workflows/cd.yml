name: CD

on:
  push:
    tags: ['v*.*.*']            # production deploy only on semver tags
    branches: [main]            # staging deploy on every main push
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options: [staging, production]

# Prevent overlapping deploys to the same environment.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# ───────────────────────────────────────────────────────────────────────────
# Backend → Render: deploy automático via integração GitHub do Render
# (blueprint em backend/render.yaml). Não há job de backend aqui.
# Histórico: os jobs de Fly.io e Cloudflare Worker foram removidos na limpeza
# de 2026-07-13 (experimentos descontinuados — recuperáveis no histórico git).
# ───────────────────────────────────────────────────────────────────────────
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend → Vercel. Vercel's GitHub integration usually does this on its
  # own — this job is a fallback / explicit invocation. Comment out if you
  # use the integration.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci
      - run: npx vercel --token=${{ secrets.VERCEL_TOKEN || secrets.VERCEL }} --prod=${{ startsWith(github.ref, 'refs/tags/v') }} --yes
