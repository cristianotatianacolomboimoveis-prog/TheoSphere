name: CD

on:
  push:
    tags: ['v*.*.*']            # production deploy only on semver tags
    # Main pushes are deployed by Vercel's native Git integration. Keeping the CLI
    # fallback off the push path avoids consuming the Vercel deployment quota twice.
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options: [staging, production]

# Prevent overlapping deploys to the same environment.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

# ───────────────────────────────────────────────────────────────────────────
# Backend → Render: deploy automático via integração GitHub do Render
# (blueprint em backend/render.yaml). Não há job de backend aqui.
# Histórico: os jobs de Fly.io e Cloudflare Worker foram removidos na limpeza
# de 2026-07-13 (experimentos descontinuados — recuperáveis no histórico git).
# ───────────────────────────────────────────────────────────────────────────
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Frontend → Vercel. Automatic main-branch deploys are handled by Vercel's
  # native Git integration. This workflow remains available for explicit
  # tag-based production deploys and manual staging/production redeploys.
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Deploy frontend (Vercel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.target == 'production') && 'production' || 'staging' }}

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - run: npm ci
      - run: npx vercel --token=${{ secrets.VERCEL_TOKEN || secrets.VERCEL }} --prod=${{ startsWith(github.ref, 'refs/tags/v') || inputs.target == 'production' }} --yes
