name: Agente Autônomo de QA Diário

on:
  schedule:
    # Executa todos os dias às 09:00 UTC (06:00 BRT)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  qa-suite:
    name: Executar Testes E2E e Fluxos Críticos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Verificações Estáticas de Integridade
        run: |
          echo "=== 1. CHECAGENS ESTÁTICAS DE SEGURANÇA E INTEGRIDADE ==="
          node audit/scripts/static-checks.mjs

      - name: Executar Suíte do Agente Autônomo contra Produção (Fase 2 - Fluxos Críticos)
        env:
          BASE_URL: 'https://theosphere.onrender.com'
        run: |
          echo "=== 2. AGENTE AUTÔNOMO DE QA (FASE 2: FLUXOS CRÍTICOS EM PRODUÇÃO) ==="
          node audit/scripts/qa-phase2-suite.mjs

      - name: Executar Suíte do Agente Autônomo contra Produção (Fase 3 - Jornadas E2E & Multi-Tenant)
        env:
          BASE_URL: 'https://theosphere.onrender.com'
        run: |
          echo "=== 3. AGENTE AUTÔNOMO DE QA (FASE 3: JORNADAS E2E & MULTI-TENANT ISOLATION) ==="
          node audit/scripts/qa-phase3-suite.mjs

      - name: Arquivar Relatórios de QA Diários
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-qa-diario-${{ github.run_id }}
          path: audit/reports/

      - name: Executar Agente de Auto-Fix e Abertura de PR (se houver falhas)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 4. AGENTE DE AUTO-FIX (ABERTURA DE PULL REQUEST EM CASO DE FALHA) ==="
          node audit/scripts/auto-fix-pr.mjs
