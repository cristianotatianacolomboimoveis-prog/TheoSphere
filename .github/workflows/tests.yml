name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend tests with PostGIS+pgvector and Redis service containers
  # ─────────────────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: ghcr.io/payloadcms/postgis-vector:latest
        env:
          POSTGRES_USER: theosphere
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: theosphere_test
        options: >-
          --health-cmd "pg_isready -U theosphere -d theosphere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        node-version: ['20.x']

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://theosphere:testpass123@localhost:5432/theosphere_test
      DIRECT_URL: postgresql://theosphere:testpass123@localhost:5432/theosphere_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci_secret_min_32_chars_for_joi_validation_to_pass_x
      NODE_ENV: test
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enable Postgres extensions
        run: |
          PGPASSWORD=testpass123 psql -h localhost -U theosphere -d theosphere_test -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=testpass123 psql -h localhost -U theosphere -d theosphere_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend tests and build validation
  # ─────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['20.x']

    defaults:
      run:
        working-directory: frontend-v2

    env:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3002
      NEXT_PUBLIC_MAPBOX_TOKEN: ''
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build frontend
        run: npm run build
