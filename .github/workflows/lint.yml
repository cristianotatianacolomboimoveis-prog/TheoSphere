name: Lint & Format Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Install frontend dependencies
        run: cd frontend-v2 && npm install

      - name: Lint backend
        run: cd backend && npm run lint

      - name: Lint frontend
        run: cd frontend-v2 && npm run lint

      - name: Check formatting (backend)
        run: cd backend && npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Check formatting (frontend)
        run: cd frontend-v2 && npx prettier --check "src/**/*.{ts,tsx}"
