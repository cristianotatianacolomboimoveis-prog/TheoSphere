services:
  - type: web
    name: theosphere-backend
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is set automatically by Render — do NOT override it.
      - key: DATABASE_URL
        sync: false # Fill in the Render dashboard
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://theosphere.vercel.app" # Replace with your actual frontend URL

