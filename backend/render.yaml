services:
  - type: web
    name: theosphere-backend
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is set automatically by Render — do NOT override it.
      - key: DATABASE_URL
        sync: false # Fill in the Render dashboard
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Teste fechado: amplia a cota mensal de IA do plano gratuito sem mudar
      # a tabela de /pricing (padrão do plano: 10). Remova ao fim do teste.
      - key: AI_CREDITS_FREE_MONTHLY
        value: "100"
      - key: ALLOWED_ORIGINS
        value: "https://cristianocolombo.vercel.app,https://theosphere.vercel.app,https://frontend-v2-lake.vercel.app"
      # Redis (Render Key Value) — usado pelo EventBus (pub/sub), throttler
      # distribuído e cache L2 de embeddings. Sem esta var o backend roda com
      # pub/sub desabilitado (não é fatal, mas perde eventos e rate-limit global).
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: theosphere-redis
          property: connectionString

  # Instância Key Value (Redis-compatível) — plano free (25 MB).
  # ipAllowList vazio = acesso apenas interno (serviços do mesmo workspace).
  - type: keyvalue
    name: theosphere-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

